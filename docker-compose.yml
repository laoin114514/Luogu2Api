# Luogu2Api 一键起栈：api（含管理台，与 Dockerfile 同一个镜像）+ MySQL 8.4。
#
# 配置只有一个来源：**configs/.env**——就是本地开发那份，scripts/dev.ps1 读的同一个文件。
# compose 用 env_file 把整份文件注入容器，所以 .env 里加/改变量不用动本文件；
# compose 只覆盖"容器里必然不同"的四项（DB_HOST / DB_PORT / HTTP_ADDR / TZ）。
#
# 为什么不用 `${VAR}` 插值：compose 的插值只读**与本文件同目录的 .env**，既不读 env_file，
# 更不读 configs/.env。这里刻意绕开它——MySQL 的 root 密码由 mysql 的 entrypoint 从
# DB_PASSWORD 改名而来（见下面的注释），密码因此只需要写一遍、命令也不需要 --env-file。
#
# 首次启动：
#   cp configs/env.example configs/.env    # 本地开发已经做过这步的话跳过
#   docker compose up -d --build
#   管理台 http://127.0.0.1:8080/dashboard/（ADMIN_TOKEN 留空 = 管理路由不注册）
#
# 结构迁移：模型是唯一来源。库/表不存在时由服务自己补齐（DB_MIGRATE_ON_START=true，
# 在 configs/.env 里）；不想让服务动结构就先 `docker compose run --rm api -migrate`。
#
# 依赖：pkg/luoguClient 是 git submodule，构建镜像前先 git submodule update --init --recursive。
# 单实例：扫描器与号池都在进程内，多副本会互相踢会话（见 README「部署注意」）。

name: luogu2api

services:
  mysql:
    image: mysql:8.4
    restart: unless-stopped
    env_file:
      - configs/.env                 # 只用得到里面的 DB_PASSWORD
    environment:
      # 官方镜像默认只建 root@localhost，api 容器（另一个 network namespace）连不进来
      MYSQL_ROOT_HOST: "%"
      TZ: Asia/Shanghai
    # 官方镜像认的是 MYSQL_ROOT_PASSWORD，而本项目的密码只有一处：.env 里的 DB_PASSWORD。
    # 所以在这里做一次改名（export 会被下面的 exec 继承）再交给官方 entrypoint：
    # 密码不写两遍，也不需要每条命令都带 --env-file。
    # 不喜欢这层壳的话有两条替代路线，二选一即可：
    #   a) 在 configs/.env 里再写一行 MYSQL_ROOT_PASSWORD=<同一个密码>（同一个值存两处），
    #      并删掉下面的 entrypoint；
    #   b) 保持 entrypoint 不变，但把本文件里的配置改成 `${DB_PASSWORD}` 插值，
    #      并且每次都用 `docker compose --env-file configs/.env ...`。
    #
    # sh -c 的第一个参数是 $0，镜像的 CMD（mysqld）会作为参数接在后面 → $@ 原样转发；
    # 以后要给 mysqld 加参数，用 command: 写，这里会自动透传。
    entrypoint:
      - /bin/sh
      - -c
      - |
        export MYSQL_ROOT_PASSWORD="$${DB_PASSWORD:?configs/.env 里没有配 DB_PASSWORD}"
        exec docker-entrypoint.sh "$$@"
      - entrypoint-shim
    volumes:
      - mysql-data:/var/lib/mysql
    healthcheck:
      # 探针是新进程，看不到 PID 1 在 shell 里 export 的 MYSQL_ROOT_PASSWORD，
      # 所以这里直接用 env_file 注进来的 DB_PASSWORD。
      # 用 TCP + 一次真实查询判断"能连了"，初始化阶段（skip-networking）自然不通过。
      test: ["CMD-SHELL", "mysql --protocol=TCP -h 127.0.0.1 -u root -p\"$$DB_PASSWORD\" -e 'SELECT 1' >/dev/null 2>&1"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 40s
    # 只有需要本机客户端/工具连进来时才打开（默认不把 3306 暴露到宿主机）
    # ports:
    #   - "127.0.0.1:3306:3306"

  api:
    build:
      context: .
      dockerfile: Dockerfile
    image: luogu2api:local
    restart: unless-stopped
    depends_on:
      mysql:
        condition: service_healthy
    env_file:
      - configs/.env                 # 整份注入：必填项、号池参数、ADMIN_TOKEN 全从这儿来
    environment:
      # 只覆盖容器里必然不同的四项；.env 里那份 DB_HOST=127.0.0.1 是给本地开发用的
      DB_HOST: mysql
      DB_PORT: "3306"
      HTTP_ADDR: ":8080"
      TZ: Asia/Shanghai
    ports:
      - "8080:8080"                  # 要换宿主端口就改这一行
    # 探活沿用镜像里的 HEALTHCHECK（只看 HTTP 服务本身，理由见 Dockerfile）
    stop_grace_period: 30s           # 覆盖默认 10s：留给 HTTP_SHUTDOWN_TIMEOUT 优雅关闭
    security_opt:
      - no-new-privileges:true

volumes:
  mysql-data:
